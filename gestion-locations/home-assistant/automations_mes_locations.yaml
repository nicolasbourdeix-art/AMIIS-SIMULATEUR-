# ───────────────────────────────────────────────────────────────
# Mes Locations — automatisation prête à l'emploi pour Soustons
# (à coller à la fin de automations.yaml ; nécessite les capteurs de mes_locations.yaml
#  et le blueprint blueprints/automation/mes_locations/chauffage.yaml)
#
# Tilh n'utilise pas ce fichier : les réservations sont intégrées directement à vos
# automatisations « programmation_pac » (voir tilh_programmation_pac.yaml).
# ───────────────────────────────────────────────────────────────

# Soustons — radiateurs électriques : on règle directement les deux thermostats.
# La consigne n'est envoyée qu'aux changements (préchauffage, arrivée, départ…),
# les voyageurs restent libres de régler la température pendant leur séjour.
- id: mes_locations_chauffage_soustons
  alias: "Locations — chauffage Soustons"
  use_blueprint:
    path: mes_locations/chauffage.yaml
    input:
      capteur: sensor.location_soustons_chauffage
      thermostats: [climate.thermostat, climate.thermostat_chambre]

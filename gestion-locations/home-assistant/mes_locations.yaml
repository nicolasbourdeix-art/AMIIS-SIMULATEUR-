# ───────────────────────────────────────────────────────────────
# Mes Locations — capteurs lus depuis l'application (package Home Assistant)
#
# 1. Copier ce fichier dans  config/packages/mes_locations.yaml
# 2. Dans configuration.yaml :
#      homeassistant:
#        packages: !include_dir_named packages
# 3. Dans secrets.yaml, coller l'adresse affichée dans l'appli
#    (Réglages → Chauffage & eau chaude) :
#      mes_locations_url: "https://script.google.com/macros/s/XXXX/exec?ha=CLE"
# 4. Redémarrer Home Assistant.
#
# TILH1 = Le refuge en bois rustique (plancher chauffant), TILH2 = Le petit chalet landais rustique (radiateurs).
# Chauffage : un capteur par logement. État = mode (confort / menage / eco / inoccupe / arret),
#   attribut « consigne » = température voulue.
# Eau chaude : un capteur par ballon. État = relance / marche / arret,
#   attribut « consigne_ecs » = température voulue. À Tilh, un seul ballon (pompe à chaleur)
#   pour les deux maisons : il est en marche dès qu'une des deux en a besoin.
# Si un identifiant a changé dans l'appli, adapter « biens.XXX » / « eau_chaude.XXX ».
# ───────────────────────────────────────────────────────────────

rest:
  - resource: !secret mes_locations_url
    scan_interval: 600
    timeout: 60
    sensor:
      - name: "Location Refuge chauffage"
        unique_id: mes_locations_tilh_1
        icon: mdi:home-thermometer
        value_template: "{{ value_json.biens.TILH1.mode | default('unknown') }}"
        json_attributes_path: "$.biens.TILH1"
        json_attributes: [consigne, occupe, raison, voyageurs, arrivee, depart, prochain_changement, prochain_mode, prochaine_consigne, planning]
      - name: "Location Chalet chauffage"
        unique_id: mes_locations_tilh_2
        icon: mdi:home-thermometer
        value_template: "{{ value_json.biens.TILH2.mode | default('unknown') }}"
        json_attributes_path: "$.biens.TILH2"
        json_attributes: [consigne, occupe, raison, voyageurs, arrivee, depart, prochain_changement, prochain_mode, prochaine_consigne, planning]
      - name: "Location Soustons chauffage"
        unique_id: mes_locations_soustons
        icon: mdi:home-thermometer
        value_template: "{{ value_json.biens.SOUSTONS.mode | default('unknown') }}"
        json_attributes_path: "$.biens.SOUSTONS"
        json_attributes: [consigne, occupe, raison, voyageurs, arrivee, depart, prochain_changement, prochain_mode, prochaine_consigne, planning]
      - name: "Location Tilh eau chaude"
        unique_id: mes_locations_ecs_tilh
        icon: mdi:water-boiler
        value_template: "{{ value_json.eau_chaude.TILH.etat | default('unknown') }}"
        json_attributes_path: "$.eau_chaude.TILH"
        json_attributes: [consigne_ecs, ecs, ecs_prioritaire, raison, logements, prochain_changement, prochain_etat, prochaine_consigne_ecs, planning]
      - name: "Location Soustons eau chaude"
        unique_id: mes_locations_ecs_soustons
        icon: mdi:water-boiler
        value_template: "{{ value_json.eau_chaude.SOUSTONS.etat | default('unknown') }}"
        json_attributes_path: "$.eau_chaude.SOUSTONS"
        json_attributes: [consigne_ecs, ecs, ecs_prioritaire, raison, logements, prochain_changement, prochain_etat, prochaine_consigne_ecs, planning]
    binary_sensor:
      - name: "Location Refuge occupée"
        unique_id: mes_locations_tilh_1_occupe
        device_class: occupancy
        value_template: "{{ value_json.biens.TILH1.occupe | default(false) }}"
      - name: "Location Chalet occupée"
        unique_id: mes_locations_tilh_2_occupe
        device_class: occupancy
        value_template: "{{ value_json.biens.TILH2.occupe | default(false) }}"
      - name: "Location Soustons occupée"
        unique_id: mes_locations_soustons_occupe
        device_class: occupancy
        value_template: "{{ value_json.biens.SOUSTONS.occupe | default(false) }}"

blueprint:
  name: Mes Locations — eau chaude selon les réservations
  description: >
    Pilote un ballon d'eau chaude d'après le capteur « Location … eau chaude » de l'application Mes Locations.
    Créer une automatisation par ballon (à Tilh : un seul ballon, relié à la pompe à chaleur, pour les deux maisons).

    - **Relance** (avant une arrivée) : montée à la température de relance (60 °C), quel que soit le tarif.

    - **Marche** (pendant un séjour) : température « séjour ». Avec un interrupteur et un capteur d'heures creuses,
      le ballon ne chauffe qu'en heures creuses.

    - **Arrêt** (personne) : température « logement vide », ou mode arrêt / vacances du chauffe-eau.

    - Si vous avez déjà votre propre gestion de l'eau chaude (charge de nuit, solaire, légionelle…), ne renseignez
      pas le chauffe-eau : utilisez plutôt le bouton de relance, l'indicateur d'absence et les éléments à couper.

    - Vérifié toutes les 15 minutes. Si l'application ne répond pas, rien n'est modifié.
  domain: automation
  input:
    capteur:
      name: Capteur eau chaude
      description: Le capteur « Location … eau chaude » créé par le package mes_locations.yaml
      selector:
        entity:
          domain: sensor
    chauffe_eau:
      name: Chauffe-eau piloté par température
      description: >
        L'entité de la carte « Eau chaude sanitaire » : water_heater (cas le plus courant pour une pompe à chaleur),
        climate ou number (consigne d'eau chaude). La température voulue est envoyée par l'application.
      default: []
      selector:
        entity:
          domain: [water_heater, climate, number]
          multiple: true
    mode_marche:
      name: Mode du chauffe-eau quand il doit chauffer (facultatif)
      description: Mode de fonctionnement water_heater à appliquer en relance et pendant les séjours (ex. « eco », « performance », « heat_pump »). Vide = ne pas changer le mode.
      default: ""
      selector: { text: {} }
    mode_arret:
      name: Mode du chauffe-eau quand personne n'en a besoin (facultatif)
      description: Ex. « off », « vacation », « eco ». Vide = seulement baisser la température.
      default: ""
      selector: { text: {} }
    bouton_relance:
      name: Bouton « eau chaude maintenant » de votre installation (facultatif)
      description: input_boolean allumé au début de chaque relance avant une arrivée (ex. input_boolean.eau_chaude_relance).
      default: []
      selector:
        entity:
          domain: input_boolean
          multiple: true
    indicateur_absence:
      name: Indicateur d'absence (facultatif)
      description: >
        input_boolean allumé quand personne n'a besoin d'eau chaude, éteint sinon
        (ex. input_boolean.location_eau_chaude_absence, créé par le package). Vos propres automatisations peuvent le tester.
      default: []
      selector:
        entity:
          domain: input_boolean
          multiple: true
    couper_en_absence:
      name: À couper pendant l'absence, à rallumer ensuite (facultatif)
      description: ex. input_boolean.resistance_ballon_auto (résistance d'appoint automatique).
      default: []
      selector:
        entity:
          domain: [input_boolean, switch]
          multiple: true
    interrupteur:
      name: Ballon sur interrupteur (facultatif)
      description: Prise ou contacteur d'un ballon électrique simple (marche / arrêt).
      default: []
      selector:
        entity:
          domain: [switch, input_boolean]
          multiple: true
    heures_creuses:
      name: Heures creuses (facultatif, pour l'interrupteur)
      description: Capteur binaire à « on » pendant les heures creuses ou le surplus solaire.
      default: []
      selector:
        entity:
          domain: [binary_sensor, input_boolean]
          multiple: true

mode: queued
max: 5

trigger:
  - platform: state
    entity_id: !input capteur
    to: ~
    id: changement
  - platform: state
    entity_id: !input capteur
    attribute: consigne_ecs
    id: changement
  - platform: homeassistant
    event: start
    id: demarrage
  - platform: time_pattern
    minutes: "/15"
    id: periodique

variables:
  capteur: !input capteur
  chauffe_eau: !input chauffe_eau
  mode_marche: !input mode_marche
  mode_arret: !input mode_arret
  interrupteur: !input interrupteur
  bouton_relance: !input bouton_relance
  indicateur_absence: !input indicateur_absence
  couper_en_absence: !input couper_en_absence
  hc: !input heures_creuses
  etat: "{{ states(capteur) }}"
  consigne: "{{ state_attr(capteur, 'consigne_ecs') | float(0) }}"
  besoin: "{{ etat in ['relance', 'marche'] }}"
  hc_ok: "{{ hc | count == 0 or hc | select('is_state', 'on') | list | count > 0 }}"
  interrupteur_on: "{{ etat == 'relance' or (etat == 'marche' and hc_ok) }}"
  mode_voulu: "{{ mode_marche if besoin else mode_arret }}"

condition:
  - condition: template
    value_template: "{{ etat not in ['unknown', 'unavailable', 'none', ''] and consigne > 0 }}"

action:
  - if:
      - condition: template
        value_template: "{{ trigger.id == 'changement' and etat == 'relance' and bouton_relance | count > 0 }}"
    then:
      - service: input_boolean.turn_on
        target:
          entity_id: "{{ bouton_relance }}"
  - if:
      - condition: template
        value_template: "{{ indicateur_absence | count > 0 }}"
    then:
      - service: "input_boolean.turn_{{ 'off' if besoin else 'on' }}"
        target:
          entity_id: "{{ indicateur_absence }}"
  - if:
      - condition: template
        value_template: "{{ trigger.id in ['changement', 'demarrage'] and couper_en_absence | count > 0 }}"
    then:
      - service: "homeassistant.turn_{{ 'on' if besoin else 'off' }}"
        target:
          entity_id: "{{ couper_en_absence }}"
  - repeat:
      for_each: "{{ chauffe_eau }}"
      sequence:
        - choose:
            - conditions:
                - condition: template
                  value_template: "{{ repeat.item.startswith('water_heater.') }}"
              sequence:
                - if:
                    - condition: template
                      value_template: "{{ mode_voulu != '' and states(repeat.item) != mode_voulu }}"
                  then:
                    - service: water_heater.set_operation_mode
                      target:
                        entity_id: "{{ repeat.item }}"
                      data:
                        operation_mode: "{{ mode_voulu }}"
                      continue_on_error: true
                - if:
                    - condition: template
                      value_template: "{{ mode_voulu != 'off' and (state_attr(repeat.item, 'temperature') | float(0)) != consigne }}"
                  then:
                    - service: water_heater.set_temperature
                      target:
                        entity_id: "{{ repeat.item }}"
                      data:
                        temperature: "{{ consigne }}"
                      continue_on_error: true
            - conditions:
                - condition: template
                  value_template: "{{ repeat.item.startswith('climate.') }}"
              sequence:
                - if:
                    - condition: template
                      value_template: "{{ (state_attr(repeat.item, 'temperature') | float(0)) != consigne }}"
                  then:
                    - service: climate.set_temperature
                      target:
                        entity_id: "{{ repeat.item }}"
                      data:
                        temperature: "{{ consigne }}"
                      continue_on_error: true
            - conditions:
                - condition: template
                  value_template: "{{ repeat.item.startswith('number.') }}"
              sequence:
                - if:
                    - condition: template
                      value_template: "{{ (states(repeat.item) | float(0)) != consigne }}"
                  then:
                    - service: number.set_value
                      target:
                        entity_id: "{{ repeat.item }}"
                      data:
                        value: "{{ consigne }}"
                      continue_on_error: true
  - if:
      - condition: template
        value_template: "{{ interrupteur | count > 0 }}"
    then:
      - service: "homeassistant.turn_{{ 'on' if interrupteur_on else 'off' }}"
        target:
          entity_id: "{{ interrupteur }}"
